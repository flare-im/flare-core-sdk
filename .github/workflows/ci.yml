name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  typescript-sdk:
    name: TypeScript SDK（类型 / 架构 / 单测）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flare-core-typescript-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/flare-core-typescript-sdk/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # 影子视图是本项目的架构红线：可观察视图归 core 所有，
      # 客户端不得自建合并引擎。这条脚本是它的自动化守卫。
      - name: 架构守卫（禁止客户端影子视图）
        run: npm run verify:architecture

      - name: 单元测试
        run: npx vitest run

  spec-consistency:
    name: sdk-spec 契约一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sdk-spec 是七端契约的唯一真源，各端桩代码由它生成。
      # 这里只校验它自身是合法 JSON 且模块清单与目录一致，
      # 生成物漂移由各端仓库自己的 CI 负责。
      - name: 校验 sdk-spec JSON 合法性
        run: |
          fail=0
          for f in $(find sdk-spec -name '*.json'); do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error file=$f::JSON 解析失败"
              fail=1
            fi
          done
          exit $fail

  public-demos:
    name: Public demo checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash examples/bootstrap-external-apps.sh

  flutter-sdk:
    name: Flutter SDK（分析 / 单测）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flare-core-flutter-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 安装依赖
        run: dart pub get

      # 与 typescript-sdk 同级的门禁：此前 Dart 包在 CI 里是盲区，
      # `make check` 声称会查 Dart 但没有任何 job 真的跑它。
      - name: 静态分析
        run: dart analyze --fatal-infos

      - name: 单元测试（含 sdk-spec/golden 契约用例）
        run: dart test

  apple-sdk:
    name: Apple SDK（swift build）
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/flare-core-apple-sdk
    steps:
      - uses: actions/checkout@v4

      # 该包只依赖生成的 C 头文件，不需要原生产物即可编译，
      # 足以抓住契约重生成后 Swift 侧的类型漂移。
      - name: 编译
        run: swift build
